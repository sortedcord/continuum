[package]
name = "continuum-daemon"
description = "The `continuum` daemon and CLI for Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "continuum"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
bluer = { version = "0.17", features = ["bluetoothd"] }
clap = { version = "4", features = ["derive", "env"] }
continuum-core.workspace = true
continuum-linux.workspace = true
continuum-net.workspace = true
continuum-quickshare.workspace = true
if-addrs = "0.15.0"
qrcode = { version = "0.15", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["full"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true
