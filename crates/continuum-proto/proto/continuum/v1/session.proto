// Continuum session protocol, version 1.
//
// These messages are only ever exchanged inside an authenticated, encrypted
// session. Nothing in this file is sent in the clear.
syntax = "proto3";

package continuum.v1;

enum DeviceKind {
  DEVICE_KIND_UNSPECIFIED = 0;
  DEVICE_KIND_PHONE = 1;
  DEVICE_KIND_TABLET = 2;
  DEVICE_KIND_LAPTOP = 3;
  DEVICE_KIND_DESKTOP = 4;
  DEVICE_KIND_SERVER = 5;
}

message DeviceInfo {
  string name = 1;
  DeviceKind kind = 2;
  // Highest Continuum protocol version the device speaks.
  uint32 protocol_version = 3;
}

// A versioned service the device offers, e.g. {"clipboard", 1}.
// The device speaks every version from min_version to version; both sides
// use the highest version they have in common.
message Capability {
  string name = 1;
  // Highest supported version.
  uint32 version = 2;
  // Lowest supported version; 0 means the same as `version`.
  uint32 min_version = 3;
}

message CapabilityManifest {
  repeated Capability capabilities = 1;
}

// First message each side sends after the handshake completes.
message Hello {
  DeviceInfo device = 1;
  CapabilityManifest manifest = 2;
  // The sender's current presence key (32 bytes). Lets peers pick up a
  // rotated key, e.g. after the sender unpaired another device.
  bytes presence_key = 3;
}

// A message for a feature negotiated through the capability manifests.
// Each feature defines its own body schema (see proto/continuum/features).
message FeatureMessage {
  string capability = 1;
  // Negotiated version the body is encoded with.
  uint32 version = 2;
  bytes body = 3;
}

message Ping {
  uint64 nonce = 1;
}

message Pong {
  uint64 nonce = 1;
}

message Goodbye {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_SHUTDOWN = 1;
    REASON_UNPAIRED = 2;
    REASON_PROTOCOL_ERROR = 3;
  }
  Reason reason = 1;
}

// Top-level frame for every message on a Continuum session.
message Envelope {
  oneof body {
    Hello hello = 1;
    Ping ping = 2;
    Pong pong = 3;
    Goodbye goodbye = 4;
    FeatureMessage feature = 5;
  }
}
